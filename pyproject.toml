[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docintake"
version = "0.1.0"
description = "AI Document Intake Pipeline — LLM-powered structured extraction, validation, persistence and routing."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Ray", email = "gozuray@users.noreply.github.com" }]
keywords = ["llm", "fastapi", "prefect", "document-intake", "pipeline", "automation"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prefect>=3.0",
    "openai>=1.40",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "aiosqlite>=0.20",
]

[project.urls]
Homepage = "https://github.com/gozuray/ai-document-intake"
Repository = "https://github.com/gozuray/ai-document-intake"

[tool.hatch.build.targets.wheel]
packages = ["src/docintake"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "samples", "README.md", "pyproject.toml"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # pytest.fixture returns are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
